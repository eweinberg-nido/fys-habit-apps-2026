        class AudioFX {
            constructor() {
                this.ctx = null;
                this.ambientOsc = null;
                this.ambientGain = null;
                this.soundEnabled = true;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.12) {
                if (!this.soundEnabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            pop() { this.playTone(650, 'sine', 0.08, 0.15); }
            coin() {
                this.playTone(987.77, 'sine', 0.08, 0.12);
                setTimeout(() => this.playTone(1318.51, 'sine', 0.25, 0.15), 80);
            }
            success() {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((n, idx) => {
                    setTimeout(() => this.playTone(n, 'triangle', 0.2, 0.15), idx * 90);
                });
            }
            error() {
                this.playTone(220, 'sawtooth', 0.2, 0.15);
                setTimeout(() => this.playTone(180, 'sawtooth', 0.3, 0.15), 150);
            }
            levelUp() {
                const notes = [440, 554.37, 659.25, 880, 1108.73];
                notes.forEach((n, idx) => {
                    setTimeout(() => this.playTone(n, 'sine', 0.28, 0.2), idx * 100);
                });
            }
            startAmbient(type) {
                this.stopAmbient();
                if (!this.soundEnabled) return;
                this.init();
                if (!this.ctx) return;
                
                if (type === 'rain' || type === 'white' || type === 'waves') {
                    const bufferSize = this.ctx.sampleRate * 2;
                    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const whiteNoise = this.ctx.createBufferSource();
                    whiteNoise.buffer = noiseBuffer;
                    whiteNoise.loop = true;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = type === 'rain' ? 'lowpass' : (type === 'waves' ? 'lowpass' : 'bandpass');
                    filter.frequency.value = type === 'rain' ? 700 : (type === 'waves' ? 400 : 1200);

                    this.ambientGain = this.ctx.createGain();
                    this.ambientGain.gain.setValueAtTime(0.04, this.ctx.currentTime);

                    whiteNoise.connect(filter);
                    filter.connect(this.ambientGain);
                    this.ambientGain.connect(this.ctx.destination);

                    whiteNoise.start();
                    this.ambientOsc = whiteNoise;
                }
            }
            stopAmbient() {
                if (this.ambientOsc) {
                    try { this.ambientOsc.stop(); } catch(e) {}
                    this.ambientOsc = null;
                }
            }
        }

        function generateMathProblem(difficulty = 'easy') {
            let a, b, op, ans, text;
            if (difficulty === 'easy') {
                const ops = ['+', '-'];
                op = ops[Math.floor(Math.random() * ops.length)];
                if (op === '+') {
                    a = Math.floor(Math.random() * 25) + 5;
                    b = Math.floor(Math.random() * 25) + 5;
                    ans = a + b;
                } else {
                    a = Math.floor(Math.random() * 30) + 15;
                    b = Math.floor(Math.random() * a);
                    ans = a - b;
                }
                text = `${a} ${op} ${b}`;
            } else if (difficulty === 'medium') {
                const ops = ['×', '+', '-'];
                op = ops[Math.floor(Math.random() * ops.length)];
                if (op === '×') {
                    a = Math.floor(Math.random() * 12) + 2;
                    b = Math.floor(Math.random() * 12) + 2;
                    ans = a * b;
                } else if (op === '+') {
                    a = Math.floor(Math.random() * 80) + 20;
                    b = Math.floor(Math.random() * 80) + 20;
                    ans = a + b;
                } else {
                    a = Math.floor(Math.random() * 90) + 40;
                    b = Math.floor(Math.random() * 40) + 10;
                    ans = a - b;
                }
                text = `${a} ${op} ${b}`;
            } else {
                const coeff = Math.floor(Math.random() * 5) + 2;
                ans = Math.floor(Math.random() * 10) + 1;
                const constVal = Math.floor(Math.random() * 15) + 3;
                const total = (coeff * ans) + constVal;
                text = `${coeff}x + ${constVal} = ${total}  (find x)`;
            }
            return { text, ans };
        }

        function MascotDisplay({ state, hatId, speciesId, onClick }) {
            const usageRatio = state.screenTimeMins / state.dailyLimitMins;
            let moodKey = 'HAPPY';

            if (state.forcedMood) {
                moodKey = state.forcedMood.toUpperCase();
            } else {
                if (usageRatio < 0.25) moodKey = 'ECSTATIC';
                else if (usageRatio < 0.50) moodKey = 'HAPPY';
                else if (usageRatio < 0.75) moodKey = 'MILD_TIRED';
                else if (usageRatio < 0.95) moodKey = 'DROWSY';
                else if (usageRatio < 1.00) moodKey = 'STRESSED';
                else moodKey = 'EXHAUSTED';
            }

            const activePet = PET_SPECIES.find(p => p.id === speciesId) || PET_SPECIES[0];

                        {hatId === 'party' && <div className="absolute -top-9 left-12 text-5xl z-20 drop-shadow-lg">🎉</div>}
                        {hatId === 'headphones' && <div className="absolute -top-3 left-1 text-6xl z-20 drop-shadow-md">🎧</div>}
                        {hatId === 'glasses' && <div className="absolute top-12 left-8 text-5xl z-20 drop-shadow-md">🕶️</div>}
                        {hatId === 'halo' && <div className="absolute -top-9 left-10 text-5xl z-20 drop-shadow-xl animate-pulse">😇</div>}

                            <ellipse cx="135" cy="175" rx="22" ry="12" fill="#15803d" opacity="0.9"/>

                            <path

        function FocusTimerMode({ onFocusComplete, onClose }) {
            const [timerMode, setTimerMode] = React.useState('pomodoro');
            const [selectedDuration, setSelectedDuration] = React.useState(25);
            const [secondsLeft, setSecondsLeft] = React.useState(25 * 60);
            const [stopwatchSecs, setStopwatchSecs] = React.useState(0);
            const [isRunning, setIsRunning] = React.useState(false);
            const [ambientSound, setAmbientSound] = React.useState('none');
            const [showConfirmQuit, setShowConfirmQuit] = React.useState(false);

            React.useEffect(() => {
                let timer = null;
                if (isRunning) {
                    if (timerMode === 'stopwatch') {
                        timer = setInterval(() => setStopwatchSecs(s => s + 1), 1000);
                    } else if (secondsLeft > 0) {
                        timer = setInterval(() => setSecondsLeft(s => s - 1), 1000);
                    } else if (secondsLeft === 0) {
                        setIsRunning(false);
                        sound.stopAmbient();
                        sound.success();
                        confetti({ particleCount: 140, spread: 90, origin: { y: 0.6 } });
                        onFocusComplete(selectedDuration);
                    }
                }
                return () => clearInterval(timer);
            }, [isRunning, secondsLeft, timerMode]);

            const switchMode = (mode, dur) => {
                sound.pop();
                setTimerMode(mode);
                setSelectedDuration(dur);
                setSecondsLeft(dur * 60);
                setStopwatchSecs(0);
                setIsRunning(false);
            };

            const toggleAmbient = (type) => {
                sound.pop();
                if (ambientSound === type) {
                    setAmbientSound('none');
                    sound.stopAmbient();
                } else {
                    setAmbientSound(type);
                    sound.startAmbient(type);
                }
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const currentSecs = timerMode === 'stopwatch' ? stopwatchSecs : secondsLeft;
            const progressRatio = timerMode === 'stopwatch' ? 1 : (1 - (secondsLeft / (selectedDuration * 60)));

            return (
                <div className="absolute inset-0 z-50 bg-slate-950/95 backdrop-blur-xl flex flex-col justify-between p-6 animate-fade-in overflow-y-auto">
                    <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <span className="text-2xl">🌱</span>
                            <h3 className="font-display font-bold text-xl text-emerald-300">Tree Growth Focus Timer</h3>
                        </div>
                        <button 
                            onClick={() => {
                                if (isRunning) setShowConfirmQuit(true);
                                else { sound.stopAmbient(); onClose(); }
                            }} 
                            className="w-9 h-9 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"
                        >
                            <i className="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>

                    <div className="my-auto flex flex-col items-center justify-center text-center">
                        <div className="flex bg-slate-900/90 p-1 rounded-2xl border border-slate-700/80 mb-4 gap-1">
                            <button onClick={() => switchMode('pomodoro', 25)} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${timerMode === 'pomodoro' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Pomodoro (25m)</button>
                            <button onClick={() => switchMode('short_break', 5)} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${timerMode === 'short_break' ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}>Short Break (5m)</button>
                            <button onClick={() => switchMode('stopwatch', 0)} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${timerMode === 'stopwatch' ? 'bg-purple-600 text-white' : 'text-slate-400'}`}>Stopwatch</button>
                        </div>

                        <div className="relative w-48 h-48 flex items-center justify-center my-2">
                            <div className="absolute inset-0 rounded-full border-4 border-emerald-500/20"></div>
                            <div 
                                className="absolute inset-0 rounded-full border-4 border-emerald-400 transition-all duration-1000"
                                style={{ clipPath: `inset(0 0 ${100 - (progressRatio * 100)}% 0)` }}
                            ></div>

                            <div className="text-7xl transition-all duration-700 transform hover:scale-110">
                                {timerMode === 'short_break' ? '☕' : (
                                    progressRatio < 0.25 ? '🌱' : (progressRatio < 0.6 ? '🌿' : (progressRatio < 0.95 ? '🪴' : '🌳'))
                                )}
                            </div>
                        </div>

                        <h2 className="font-display text-5xl font-extrabold text-white tracking-wider my-2">
                            {formatTime(currentSecs)}
                        </h2>
                        <p className="text-xs text-emerald-400 font-bold px-4">
                            {isRunning ? "Sparky is meditating with you... Stay off distractions!" : "Choose session duration & plant your tree"}
                        </p>
                    </div>

                    <div className="space-y-3">

                                className={`px-3 py-2 rounded-xl text-xs font-bold border transition-all ${ambientSound === 'rain' ? 'bg-cyan-500/30 border-cyan-400 text-cyan-200' : 'bg-slate-800/80 border-slate-700 text-slate-400'}`}
                            >
                                🌧 Soft Rain

                            <button

        function GamesHubView({ onEarnReward }) {
            const [gameTab, setGameTab] = React.useState('math');
            const [mathDiff, setMathDiff] = React.useState('easy');
            const [currentMath, setCurrentMath] = React.useState(generateMathProblem('easy'));
            const [mathInput, setMathInput] = React.useState('');
            const [mathStreak, setMathStreak] = React.useState(0);
            const [feedback, setFeedback] = React.useState('');

            const vocabList = [
                { word: 'FOCUS', hint: 'Concentration on task' },
                { word: 'MINDFUL', hint: 'Aware and present state' },
                { word: 'WISDOM', hint: 'Knowledge applied well' },
                { word: 'STREAK', hint: 'Consecutive goal days' },
                { word: 'MASTERY', hint: 'Expert level performance' }
            ];
            const [wordIdx, setWordIdx] = React.useState(0);
            const [scrambled, setScrambled] = React.useState('');
            const [wordInput, setWordInput] = React.useState('');

            const [memoryGrid, setMemoryGrid] = React.useState([1, 2, 3, 4, 1, 2, 3, 4].sort(() => Math.random() - 0.5));
            const [flipped, setFlipped] = React.useState([]);
            const [matched, setMatched] = React.useState([]);

            React.useEffect(() => {
                if (gameTab === 'word') {
                    const target = vocabList[wordIdx].word;
                    const sc = target.split('').sort(() => Math.random() - 0.5).join(' ');
                    setScrambled(sc);
                }
            }, [wordIdx, gameTab]);

            const handleMathSubmit = (e) => {
                e.preventDefault();
                if (parseInt(mathInput) === currentMath.ans) {
                    sound.coin();
                    setMathStreak(s => s + 1);
                    setFeedback('✅ Correct! +10 Coins');
                    onEarnReward(10, 15);
                    setCurrentMath(generateMathProblem(mathDiff));
                    setMathInput('');
                } else {
                    sound.error();
                    setFeedback('❌ Incorrect, try again!');
                }
            };

            const handleWordSubmit = (e) => {
                e.preventDefault();
                if (wordInput.trim().toUpperCase() === vocabList[wordIdx].word) {
                    sound.success();
                    setFeedback('🎉 Correct Word! +20 Coins');
                    onEarnReward(20, 25);
                    setWordInput('');
                    setWordIdx((wordIdx + 1) % vocabList.length);
                } else {
                    sound.error();
                    setFeedback('❌ Try again!');
                }
            };

            const handleMemoryClick = (idx) => {
                if (flipped.length === 2 || flipped.includes(idx) || matched.includes(idx)) return;
                sound.pop();
                const newFlipped = [...flipped, idx];
                setFlipped(newFlipped);

                if (newFlipped.length === 2) {
                    const [first, second] = newFlipped;
                    if (memoryGrid[first] === memoryGrid[second]) {
                        sound.coin();
                        setMatched([...matched, first, second]);
                        setFlipped([]);
                        if (matched.length + 2 === memoryGrid.length) {
                            sound.success();
                            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                            onEarnReward(35, 40);
                            setFeedback('🏆 Memory Grid Cleared! +35 Coins');
                        }
                    } else {
                        setTimeout(() => setFlipped([]), 800);
                    }
                }
            };

            return (
                <div className="p-4 space-y-4 pb-24 animate-fade-in">
                    <div className="glass-card rounded-2xl p-4 border-slate-700">
                        <h2 className="font-display text-2xl font-bold text-white">Brain Gym & Games</h2>
                        <p className="text-xs text-slate-300">Play productive mini-games to sharpen focus & earn coins!</p>
                    </div>

                    <div className="flex bg-slate-900/80 p-1 rounded-xl border border-slate-700">
                        <button onClick={() => { sound.pop(); setGameTab('math'); setFeedback(''); }} className={`flex-1 py-2 rounded-lg font-bold text-xs ${gameTab === 'math' ? 'bg-purple-600 text-white shadow' : 'text-slate-400'}`}>
                            🧮 Math Blitz
                        </button>
                        <button onClick={() => { sound.pop(); setGameTab('word'); setFeedback(''); }} className={`flex-1 py-2 rounded-lg font-bold text-xs ${gameTab === 'word' ? 'bg-purple-600 text-white shadow' : 'text-slate-400'}`}>
                            🔤 Vocab Builder
                        </button>
                        <button onClick={() => { sound.pop(); setGameTab('memory'); setFeedback(''); }} className={`flex-1 py-2 rounded-lg font-bold text-xs ${gameTab === 'memory' ? 'bg-purple-600 text-white shadow' : 'text-slate-400'}`}>
                            🧠 Memory Grid
                        </button>
                    </div>

                    {feedback && (
                        <div className="p-2.5 rounded-xl bg-purple-500/20 border border-purple-500/40 text-center text-xs font-bold text-purple-300">
                            {feedback}
                        </div>
                    )}

                    {gameTab === 'math' && (
                        <div className="glass-card rounded-2xl p-5 border-slate-700 space-y-4">
                            <div className="flex justify-between items-center">
                                <span className="text-xs font-bold text-amber-400">Streak: 🔥 {mathStreak}</span>
                                <div className="flex gap-1">
                                    <button onClick={() => { setMathDiff('easy'); setCurrentMath(generateMathProblem('easy')); }} className={`px-2 py-1 rounded text-[10px] font-bold ${mathDiff === 'easy' ? 'bg-emerald-500 text-white' : 'bg-slate-800 text-slate-400'}`}>Easy</button>
                                    <button onClick={() => { setMathDiff('medium'); setCurrentMath(generateMathProblem('medium')); }} className={`px-2 py-1 rounded text-[10px] font-bold ${mathDiff === 'medium' ? 'bg-amber-500 text-white' : 'bg-slate-800 text-slate-400'}`}>Medium</button>
                                    <button onClick={() => { setMathDiff('hard'); setCurrentMath(generateMathProblem('hard')); }} className={`px-2 py-1 rounded text-[10px] font-bold ${mathDiff === 'hard' ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-400'}`}>Hard</button>

                                {currentMath.text}

                            <form onSubmit={handleMathSubmit} className="space-y-3">

                                />

                                    Submit Answer 🚀
                                </button>
                            </form>
                        </div>
                    )}

                    {gameTab === 'word' && (

                                    Check Word ✨

                            </form>

                    {gameTab === 'memory' && (
                        <div className="glass-card rounded-2xl p-5 border-slate-700 space-y-4">
                            <div className="grid grid-cols-4 gap-3">
                                {memoryGrid.map((val, idx) => {

                                        <button 
                                            key={idx}

                                            className={`h-20 rounded-2xl font-display text-3xl flex items-center justify-center transition-all ${isFlipped ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-600 hover:bg-slate-700'}`}
                                        >
                                            {isFlipped ? icons[val - 1] : '❓'}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

            const [showEmergencyModal, setShowEmergencyModal] = React.useState(false);
            const [showFocusTimer, setShowFocusTimer] = React.useState(false);
            const [showBreatheModal, setShowBreatheModal] = React.useState(false);
            const [notification, setNotification] = React.useState(null);

            const currentThemeObj = BACKGROUND_THEMES.find(t => t.id === activeTheme) || BACKGROUND_THEMES[0];

            const showToast = (msg, icon = '✨') => {
                setNotification({ msg, icon });
                setTimeout(() => setNotification(null), 3000);
            };

            const addXp = (amount) => {
                const nextXp = xp + amount;
                if (nextXp >= 400) {
                    setLevel(l => l + 1);
                    setXp(nextXp - 400);
                    sound.levelUp();
                    showToast(`LEVEL UP! You reached Level ${level + 1}! 🎉`, '👑');
                } else {
                    setXp(nextXp);
                }
            };

            const handleBuyHat = (hat) => {
                if (coins >= hat.price) {
                    sound.coin();
                    setCoins(c => c - hat.price);
                    setOwnedHats([...ownedHats, hat.id]);
                    setActiveHat(hat.id);
                    showToast(`Unlocked & equipped ${hat.name}!`, '🎩');
                } else {
                    sound.error();
                    showToast('Not enough coins!', '⚠️');
                }
            };

            const handleBuyTheme = (theme) => {
                if (coins >= theme.price) {
                    sound.coin();
                    setCoins(c => c - theme.price);
                    setOwnedThemes([...ownedThemes, theme.id]);
                    setActiveTheme(theme.id);
                    showToast(`Applied ${theme.name} theme!`, '🎨');
                } else {
                    sound.error();
                    showToast('Not enough coins!', '⚠️');
                }
            };

            const handleFeedPet = (food) => {
                if (coins >= food.price) {
                    sound.coin();
                    setCoins(c => c - food.price);
                    setPetHunger(h => Math.min(100, h + food.hungerGain));
                    showToast(`Fed your pet ${food.name}! Fullness +${food.hungerGain}%`, '🍏');
                } else {
                    sound.error();
                    showToast('Not enough coins!', '⚠️');
                }
            };

            const handleEmergencyUnlock = (reason) => {
                setShowEmergencyModal(false);
                setCoins(c => Math.max(0, c - 80));
                setXp(x => Math.max(0, x - 30));
                setScreenTimeMins(prev => Math.max(0, prev - 45));
                sound.coin();
                showToast(`Emergency override recorded: "${reason.substring(0, 18)}..."`, '🚨');
            };

            const formatHoursMins = (totalMins) => {
                const h = Math.floor(totalMins / 60);
                const m = totalMins % 60;
                return `${h}h ${m}m`;
            };

            return (
                <div className="w-full flex flex-col items-center justify-center gap-6 py-2">
                    {/* Simulator Device Shell Toggle */}
                    <div className="glass-card px-5 py-2.5 rounded-full flex items-center gap-3 border-slate-700 shadow-lg">
                        <span className="text-xs font-bold text-slate-300">Device Simulator:</span>
                        <button 
                            onClick={() => { sound.pop(); setViewShell('phone'); }}
                            className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${viewShell === 'phone' ? 'bg-emerald-500 text-white shadow' : 'bg-slate-800 text-slate-400'}`}
                        >
                            📱 Mobile Phone View
                        </button>
                        <button 
                            onClick={() => { sound.pop(); setViewShell('mac'); }}
                            className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${viewShell === 'mac' ? 'bg-purple-600 text-white shadow' : 'bg-slate-800 text-slate-400'}`}
                        >
                            💻 Mac Desktop View
                        </button>
                    </div>

                    {/* MAIN APP FRAME */}
                    <div className={viewShell === 'phone' ? 'phone-container w-full bg-slate-950 flex flex-col justify-between shadow-2xl relative border-4 border-slate-800' : 'mac-container w-full bg-slate-950 flex flex-col justify-between shadow-2xl relative border-2 border-slate-700'}>
                        <div className={`absolute inset-0 bg-gradient-to-b ${currentThemeObj.bgClass} transition-all duration-700 pointer-events-none`}></div>

                        {/* Top Header Stats Bar */}
                        <div className="relative z-30 p-3 flex items-center justify-between border-b border-white/10 glass-card mx-3 mt-3 rounded-2xl">
                            <div className="flex items-center gap-2">
                                <div className="w-9 h-9 rounded-xl bg-purple-500/30 border border-purple-400 flex items-center justify-center font-display font-black text-purple-300 text-sm shadow">
                                    L{level}
                                </div>
                                <div>
                                    <h4 className="font-bold text-xs text-white leading-tight">Focus Master</h4>
                                    <div className="w-20 h-2 bg-slate-800 rounded-full overflow-hidden mt-1 border border-slate-700">
                                        <div className="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all" style={{ width: `${(xp / 400) * 100}%` }}></div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <div className="px-2.5 py-1 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold flex items-center gap-1">
                                    <span>🔥</span><span>{streak}</span>
                                </div>
                                <div className="px-2.5 py-1 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold flex items-center gap-1">
                                    <span>🪙</span><span>{coins}</span>
                                </div>
                            </div>
                        </div>

                        {/* Toast Notification Banner */}
                        {notification && (
                            <div className="absolute top-20 left-6 right-6 z-50 glass-card border-2 border-emerald-400/80 bg-slate-900/90 rounded-2xl p-3 shadow-2xl flex items-center gap-3 animate-bounce-slow">
                                <span className="text-2xl">{notification.icon}</span>
                                <span className="text-xs font-bold text-white">{notification.msg}</span>
                            </div>
                        )}

                        {/* TAB VIEW CONTENT */}
                        <div className="relative z-20 flex-1 overflow-y-auto">
                            {activeTab === 'sanctuary' && (
                                <div className="p-4 space-y-4">
                                    <MascotDisplay 
                                        state={{ screenTimeMins, dailyLimitMins, forcedMood }}
                                        hatId={activeHat}
                                        speciesId={activePetSpecies}
                                        onClick={() => showToast("Sparky says: Stay focused today! 🚀", "💬")}
                                    />

                                    <div className="glass-card rounded-2xl p-3 border-slate-700 flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <span className="text-xl">🍎</span>
                                            <div>
                                                <span className="text-[10px] font-bold text-slate-400 block">Pet Fullness</span>
                                                <div className="w-24 h-2.5 bg-slate-900 rounded-full overflow-hidden border border-slate-700">
                                                    <div className="h-full bg-amber-400 transition-all" style={{ width: `${petHunger}%` }}></div>
                                                </div>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setShowBreatheModal(true)} 
                                            className="px-3 py-1 rounded-xl bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 text-xs font-bold flex items-center gap-1"
                                        >
                                            🧘 Breathe
                                        </button>
                                    </div>

                                    <div className="glass-card rounded-3xl p-5 border-slate-700/80 space-y-3 shadow-xl">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Today's Screen Time</span>
                                                <h2 className="font-display text-3xl font-extrabold text-white">{formatHoursMins(screenTimeMins)}</h2>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-xs font-bold text-slate-400 block">Daily Budget</span>
                                                <span className="font-display font-bold text-slate-300">{formatHoursMins(dailyLimitMins)}</span>
                                            </div>
                                        </div>

                                        <div className="space-y-1">
                                            <div className="w-full h-4 bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-700">
                                                <div 
                                                    className={`h-full rounded-full transition-all duration-500 ${
                                                        (screenTimeMins / dailyLimitMins) >= 1.0 ? 'bg-rose-500' : 'bg-emerald-400'
                                                    }`}
                                                    style={{ width: `${Math.min(100, (screenTimeMins / dailyLimitMins) * 100)}%` }}
                                                ></div>
                                            </div>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => setShowFocusTimer(true)}
                                        className="w-full p-4 rounded-2xl btn-3d btn-3d-green font-display font-extrabold text-base flex items-center justify-center gap-2 shadow-lg"
                                    >
                                        <span>🌱 Grow Focus Tree (Pomodoro)</span>
                                    </button>
                                </div>
                            )}

                            {activeTab === 'shop' && (
                                <PetStoreWardrobeView 
                                    coins={coins}
                                    ownedHats={ownedHats}
                                    ownedThemes={ownedThemes}
                                    activeHat={activeHat}
                                    activeTheme={activeTheme}
                                    activePetSpecies={activePetSpecies}
                                    onBuyHat={handleBuyHat}
                                    onEquipHat={setActiveHat}
                                    onBuyTheme={handleBuyTheme}
                                    onEquipTheme={setActiveTheme}
                                    onSelectSpecies={setActivePetSpecies}
                                    onFeedPet={handleFeedPet}
                                />
                            )}

                            {activeTab === 'app_limits' && (
                                <AppLimitsView 
                                    apps={apps}
                                    onToggleBlock={id => setApps(apps.map(a => a.id === id ? { ...a, blocked: !a.blocked } : a))}
                                    onUpdateLimit={(id, limitMins) => setApps(apps.map(a => a.id === id ? { ...a, limitMins } : a))}
                                    onEmergencyUnlockRequest={() => setShowEmergencyModal(true)}
                                />
                            )}

                            {activeTab === 'analytics' && (
                                <ComprehensiveAnalyticsView screenTimeMins={screenTimeMins} dailyLimitMins={dailyLimitMins} apps={apps} />
                            )}

                            {activeTab === 'games' && (
                                <GamesHubView onEarnReward={(c, x) => {
                                    setCoins(prev => prev + c);
                                    addXp(x);
                                }} />
                            )}

                            {activeTab === 'homework' && (
                                <HomeworkTrackerView 
                                    assignments={assignments}
                                    onAddAssignment={item => setAssignments([...assignments, item])}
                                    onToggleComplete={id => setAssignments(assignments.map(a => a.id === id ? { ...a, completed: !a.completed } : a))}
                                />
                            )}

                            {activeTab === 'calendar' && (
                                <CalendarView assignments={assignments} />
                            )}

                            {activeTab === 'social' && (
                                <SocialFriendsView friends={FRIENDS_DATA} streak={streak} />
                            )}

                            {activeTab === 'settings' && (
                                <SettingsView 
                                    dailyLimitMins={dailyLimitMins}
                                    onUpdateBudget={setDailyLimitMins}
                                    soundEnabled={sound.soundEnabled}
                                    onToggleSound={() => sound.soundEnabled = !sound.soundEnabled}
                                    activeTheme={activeTheme}
                                    onSelectTheme={setActiveTheme}
                                    onResetProgress={() => { setScreenTimeMins(0); showToast("Progress Reset!", "🔄"); }}
                                />
                            )}
                        </div>

                        {/* BOTTOM TAB BAR */}
                        <div className="relative z-30 p-1.5 glass-card border-t border-slate-700/80 rounded-t-3xl grid grid-cols-5 md:grid-cols-9 gap-1 text-center">
                            <button onClick={() => { sound.pop(); setActiveTab('sanctuary'); }} className={`p-1.5 rounded-xl ${activeTab === 'sanctuary' ? 'text-emerald-400 bg-emerald-500/10 font-bold' : 'text-slate-400'}`}>
                                <i className="fa-solid fa-house text-sm block"></i>
                                <span className="text-[8px]">Home</span>
                            </button>
                            <button onClick={() => { sound.pop(); setActiveTab('shop'); }} className={`p-1.5 rounded-xl ${activeTab === 'shop' ? 'text-emerald-400 bg-emerald-500/10 font-bold' : 'text-slate-400'}`}>
                                <i className="fa-solid fa-store text-sm block"></i>
                                <span className="text-[8px]">Shop</span>
                            </button>
                            <button onClick={() => { sound.pop(); setActiveTab('app_limits'); }} className={`p-1.5 rounded-xl ${activeTab === 'app_limits' ? 'text-emerald-400 bg-emerald-500/10 font-bold' : 'text-slate-400'}`}>
                                <i className="fa-solid fa-mobile-screen text-sm block"></i>
                                <span className="text-[8px]">Apps</span>
                            </button>
                            <button onClick={() => { sound.pop(); setActiveTab('analytics'); }} className={`p-1.5 rounded-xl ${activeTab === 'analytics' ? 'text-emerald-400 bg-emerald-500/10 font-bold' : 'text-slate-400'}`}>
                                <i className="fa-solid fa-chart-pie text-sm block"></i>
                                <span className="text-[8px]">Stats</span>
                            </button>
                            <button onClick={() => { sound.pop(); setActiveTab('games'); }} className={`p-1.5 rounded-xl ${activeTab === 'games' ? 'text-emerald-400 bg-emerald-500/10 font-bold' : 'text-slate-400'}`}>
                                <i className="fa-solid fa-gamepad text-sm block"></i>
                                <span className="text-[8px]">Games</span>
                            </button>
                            <button onClick={() => { sound.pop(); setActiveTab('homework'); }} className={`p-1.5 rounded-xl ${activeTab === 'homework' ? 'text-emerald-400 bg-emerald-500/10 font-bold' : 'text-slate-400'}`}>
                                <i className="fa-solid fa-book text-sm block"></i>
                                <span className="text-[8px]">Tasks</span>
                            </button>
                            <button onClick={() => { sound.pop(); setActiveTab('calendar'); }} className={`p-1.5 rounded-xl ${activeTab === 'calendar' ? 'text-emerald-400 bg-emerald-500/10 font-bold' : 'text-slate-400'}`}>
                                <i className="fa-solid fa-calendar-days text-sm block"></i>
                                <span className="text-[8px]">Calendar</span>
                            </button>
                            <button onClick={() => { sound.pop(); setActiveTab('social'); }} className={`p-1.5 rounded-xl ${activeTab === 'social' ? 'text-emerald-400 bg-emerald-500/10 font-bold' : 'text-slate-400'}`}>
                                <i className="fa-solid fa-users text-sm block"></i>
                                <span className="text-[8px]">Friends</span>
                            </button>
                            <button onClick={() => { sound.pop(); setActiveTab('settings'); }} className={`p-1.5 rounded-xl ${activeTab === 'settings' ? 'text-emerald-400 bg-emerald-500/10 font-bold' : 'text-slate-400'}`}>
                                <i className="fa-solid fa-gear text-sm block"></i>
                                <span className="text-[8px]">Settings</span>
                            </button>
                        </div>

                        {/* MODAL OVERLAYS */}
                        {showFocusTimer && (
                            <FocusTimerMode 
                                onFocusComplete={(mins) => {
                                    setShowFocusTimer(false);
                                    setScreenTimeMins(prev => Math.max(0, prev - mins));
                                    addXp(100);
                                    setCoins(c => c + 50);
                                    showToast(`Grew a Lush Tree! +${mins}m Screen Refill!`, '🌳');
                                }}
                                onClose={() => setShowFocusTimer(false)}
                            />
                        )}

                        {showBreatheModal && (
                            <BreatheWidget onClose={() => setShowBreatheModal(false)} />
                        )}

                        {showEmergencyModal && (
                            <EmergencyUnlockModal 
                                coins={coins}
                                onConfirmUnlock={handleEmergencyUnlock}
                                onClose={() => setShowEmergencyModal(false)}
                            />
                        )}
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<FocusPalApp />);
    </script>
</body>
</html>
